[package]
name = "kara-desktop"
description = "Kara's boundary with the desktop: portals, UDisks2, application associations, FileManager1."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Portals: appearance (Settings) and opening files (OpenURI). Driven by the
# async-io executor that zbus already brings, not by a tokio runtime.
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "settings", "open_uri"] }
futures-lite = "2.6.1"
kara-fs.workspace = true
percent-encoding = "2.3.2"
rustix = { version = "1.1.4", features = ["fs", "process"] }
thiserror = "2.0.20"
zbus = "5.19.0"

[dev-dependencies]
tempfile = "3.27.0"
