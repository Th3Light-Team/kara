[package]
name = "kara-ui"
description = "Puente cxx-qt y binario principal de Kara."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cxx = "1.0.199"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }
kara-core.workspace = true
kara-desktop.workspace = true
kara-fs.workspace = true
kara-index.workspace = true
kara-ops.workspace = true
kara-remote = { workspace = true, features = ["sftp", "s3", "gcs", "keyring"] }
kara-vfs.workspace = true

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
cxx-qt-build = "0.10.0"
# For `QResourceFile::alias`, which `cxx-qt-build` does not re-export.
qt-build-utils = "0.10.0"
