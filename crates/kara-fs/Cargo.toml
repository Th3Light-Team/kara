[package]
name = "kara-fs"
description = "Syscalls de Kara: listado, stat, copia, movimiento, permisos POSIX y papelera FreeDesktop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
kara-core.workspace = true
kara-vfs.workspace = true
md-5 = "0.11.0"
percent-encoding = "2.3.2"
png = "0.18.1"
rustix = { version = "1.1.4", features = ["fs", "process"] }
thiserror = "2.0.20"

# The two lints below only fire inside `tests/`, which is off limits for this
# contract (its files are verified by sha256 and must not change): `common`'s
# `collect_snapshot` predates let-chains, and the batch tests intentionally
# build a one-element slice from an owned temporary via `&[x.clone()]`.
[lints.clippy]
collapsible_if = "allow"
cloned_ref_to_slice_refs = "allow"

[dev-dependencies]
kara-vfs = { workspace = true, features = ["conformance"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
png = "0.18.1"
tempfile = "3.27.0"
