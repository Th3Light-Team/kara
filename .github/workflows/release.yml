name: Release

# Pushing a tag like v0.1.0 builds the AppImage and attaches it to a GitHub
# release. Tags with a hyphen (v0.1.0-mvp.1) are marked as pre-releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.10.2"

jobs:
  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config curl \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev shared-mime-info \
            breeze-icon-theme adwaita-icon-theme \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-render-util0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Desktop icon theme
        # What a desktop session would have configured; the kara-fs icon tests
        # read it the same way the application does.
        run: |
          mkdir -p ~/.config
          printf '[Icons]\nTheme=breeze\n' > ~/.config/kdeglobals

      - name: Qt
        id: qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Build
        run: cargo build --release -p kara-ui

      - name: AppImage
        env:
          QMAKE: ${{ env.QT_ROOT_DIR }}/bin/qmake
        run: scripts/build-appimage "${GITHUB_REF_NAME#v}"

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: |
            dist/*.AppImage
            dist/SHA256SUMS

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/SHA256SUMS
          body_path: REVIEW.md
          prerelease: ${{ contains(github.ref_name, '-') }}
