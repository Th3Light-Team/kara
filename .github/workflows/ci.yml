name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  QT_VERSION: "6.10.2"

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgl1-mesa-dev libxkbcommon-dev libfontconfig1-dev shared-mime-info \
            breeze-icon-theme adwaita-icon-theme

      - name: Desktop icon theme
        # What a desktop session would have configured; the kara-fs icon tests
        # read it the same way the application does.
        run: |
          mkdir -p ~/.config
          printf '[Icons]\nTheme=breeze\n' > ~/.config/kdeglobals

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: /tmp on its own volume
        # The trash tests in kara-fs need /tmp and the source tree on different
        # devices (on a desktop /tmp is tmpfs); on the runner they share a disk.
        run: sudo mount -t tmpfs -o mode=1777 tmpfs /tmp

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
