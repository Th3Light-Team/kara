[workspace]
resolver = "3"
members = [
    "crates/kara-core",
    "crates/kara-desktop",
    "crates/kara-fs",
    "crates/kara-index",
    "crates/kara-ops",
    "crates/kara-remote",
    "crates/kara-ui",
    "crates/kara-vfs",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-or-later"
repository = "https://github.com/oliverv/kara"

[workspace.dependencies]
kara-core = { path = "crates/kara-core" }
kara-desktop = { path = "crates/kara-desktop" }
kara-fs = { path = "crates/kara-fs" }
kara-index = { path = "crates/kara-index" }
kara-ops = { path = "crates/kara-ops" }
kara-remote = { path = "crates/kara-remote" }
kara-vfs = { path = "crates/kara-vfs" }

[profile.release]
lto = "thin"
codegen-units = 1
